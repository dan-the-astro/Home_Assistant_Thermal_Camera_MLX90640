; PlatformIO Project Configuration File
;
; Seeed Studio XIAO ESP32S3 + Melexis MLX90640 thermal camera
; Exposes a live thermal image, min/max temperature and a frame-rate
; control to Home Assistant over WiFi (MQTT discovery + MJPEG stream).
;
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFIRMWARE_VERSION=\"1.0.0\"

lib_deps =
    adafruit/Adafruit MLX90640@^1.1.1
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0
